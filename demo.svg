<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
<animate id="loop" attributeName="visibility" from="visible" to="visible" begin="0s;loop.end" dur="14s"/>
<rect width="760" height="400" rx="10" fill="#0d1117"/>
<rect width="760" height="34" rx="10" fill="#161b22"/><rect y="24" width="760" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="380.0" y="22" fill="#8b949e" font-size="13" text-anchor="middle">shellundo</text>
<rect x="582" y="8" width="166" height="19" rx="9" fill="#3d2f00" stroke="#d29922"/><text x="665" y="22" fill="#d29922" font-size="11" font-weight="bold" text-anchor="middle">CONCEPT MOCKUP</text>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+1.0s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="70"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">agent "clean up the legacy module"</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+2.2s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="100"><tspan fill="#d29922">› </tspan><tspan fill="#c9d1d9">running: rm -rf src/legacy</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+3.2s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="130"><tspan fill="#3fb950">✔ </tspan><tspan fill="#c9d1d9">done, removed 37 files</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+4.6s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="160"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">ls src/legacy</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+5.4s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="190"><tspan fill="#f85149"></tspan><tspan fill="#f85149">ls: src/legacy: No such file or directory</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+6.8s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="220"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">shellundo undo</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+7.6s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="250"><tspan fill="#58a6ff">↺ </tspan><tspan fill="#c9d1d9">restoring state before the last agent turn...</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+8.6s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="280"><tspan fill="#3fb950">✔ </tspan><tspan fill="#3fb950">37 files restored (37 deleted by shell commands)</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+9.8s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="310"><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">ls src/legacy</tspan></text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="loop.begin+10.4s"/><set attributeName="opacity" to="0" begin="loop.end-0.01s"/><text x="24" y="340"><tspan fill="#c9d1d9"></tspan><tspan fill="#c9d1d9">api.ts  db.ts  models/  utils.ts  views/</tspan></text></g>
</svg>